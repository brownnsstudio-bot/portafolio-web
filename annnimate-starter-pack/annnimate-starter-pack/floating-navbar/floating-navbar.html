<div class="fnb_page">

  <header

    data-anm-dock-mode="toggle"
    data-anm-dock-offset="12"
    data-anm-dock-mark="K"
  >
    <div class="fnb_bg" data-anm-fnb-bg aria-hidden="true"></div>

    <nav class="fnb_nav" data-anm-fnb-nav aria-label="Main">
      <a class="fnb_logo" data-anm-fnb-logo href="#" aria-label="Kinetic">
        <span class="fnb_logo_text" data-anm-fnb-logo-text>Kinetic</span>
      </a>

      <ul class="fnb_links">
        <li class="fnb_links_item"><a class="fnb_link" data-anm-fnb-link href="#">Work</a></li>
        <li class="fnb_links_item"><a class="fnb_link" data-anm-fnb-link href="#">Studio</a></li>
        <li class="fnb_links_item"><a class="fnb_link" data-anm-fnb-link href="#">Journal</a></li>
        <li class="fnb_links_item"><a class="fnb_link" data-anm-fnb-link href="#">Shop</a></li>
      </ul>

      <a class="fnb_cta" data-anm-fnb-cta href="#">Contact</a>

  <section class="fnb_hero">
    <img
      class="fnb_hero_img"
      src="https://annnimate.b-cdn.net/preview-assets/vanta/hero_run_01.jpg?width=2400&format=auto"
      alt="Runner mid-stride in a shaft of light"
      decoding="async"
    />
    <div class="fnb_hero_scrim" aria-hidden="true"></div>
    <h1 class="fnb_hero_title">Run the long way</h1>
  </section>

    <p class="fnb_text">Built for the early miles and the last ones. Every pair is tested on the same loop, in every weather.</p>

    <figure class="fnb_media fnb_media_wide">
      <img
        class="fnb_media_img"
        src="https://annnimate.b-cdn.net/preview-assets/vanta/environment_track_02.jpg?width=1600&format=auto"
        alt="Lane lines curving across a red running track"
        decoding="async"
      />
    </figure>

    <figure class="fnb_media fnb_media_tall">
      <img
        class="fnb_media_img"
        src="https://annnimate.b-cdn.net/preview-assets/vanta/product_shoe_04.jpg?width=1200&format=auto"
        alt="Running shoe with a coral midsole floating on grey"
        decoding="async"
      />
    </figure>
